<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando um link</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            a{
                color: brown;
                text-decoration:none;
                font-weight: bold;
            }
            a:visited{
                color: green;
         
            }
            a:hover{
                color: black;
                text-decoration: underline;
            }
            a:active{
                color: chartreuse;
            }
            .especial::before{
                content: '⇒';
            }
            .especial::after{
            content: '⇐';
          
            }
        }
    </style>
</head>
<body>
  <h1>Personalizando link</h1>  
  <ul>
          
    <li><a href="https://github.com/glauciaOliveira-git"target="_blank">Repositório github</a></li>
           
       
   
    <li><a href="https://www.music.com/"class= 'especial'>YouTube</a></li>



    <li><a href="https://web.whatsapp.com/">whatsapp</a></li>
  </ul>
    
</body>
</html>
