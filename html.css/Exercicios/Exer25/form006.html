<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomrulários</title>
</head>
<body>
    <h1>Exemplos de Fomrulários</h1>

    <form action="cadastro.php">

        <p><label for="icolor">Cor</label>
         <input type="color" name="color" id="icolor" value="#ff4416">
        </p>

        <p>
            <label for="inivel">Nível de satisfação</label>
            <input type="range" name="nivel" id="inivel">
        </p>

        <p>
            <label for="ifoto">Enviar foto</label>
            <input type="file" name="foto" id="ifoto">
        </p>
       

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
