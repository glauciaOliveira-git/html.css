<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>

    <h1>Exemplo de Formulários</h1>

    <form action="cadastro.php" method="get" autocomplete="on">


          <fieldset>

              <legend>Sexo</legend>

                <input type="radio" name="sexo" id="if" value="F">
                <label for="if">Feminimo</label>

                <input type="radio" name="sexo" id="im" value="M">
                <label for="im">Masculino</label>

          </fieldset>


        <fieldset>

            <legend>Esportes Favoritos</legend>

            <input type="checkbox" name="Futibol" id="ifutibol">
            <label for="ifutibol">Futibol</label><br>
            
             <input type="checkbox" name="Basquete" id="ibasquebol">    
            <label for="ibasquebol">Basquete</label><br>
           
            <input type="checkbox" name="Natação" id="inatacao">
            <label for="inatacao">Natação</label><br>
            
            <input type="checkbox" name="Hidroginástica" id="ihidroginastica">
            <label for="ihidroginastica">Hidroginástica</label><br>
           
            <input type="checkbox" name="Voleibol" id="ivolei">
            <label for="ivolei">Voleibol</label><br>
            


        </fieldset>



        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
    
</body>
</html>
