<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>

    <h1>Modelos de Formulários</h1>

    <form action="cadastro.php">
<p>
    <label for="iano">Ano em que você nasceu:</label>
    <input type="number" name="ano" id="iano" min="1900" max="2026" oninput="calcIdade()">


</p>

<p>
    <label for="iidade">Idade</label>
    <output id="iidade">0</output>
</p>

<p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</p>

    </form>

    <script>
       function calcIdade() {
        let atual = new Date().getFullYear()
        iidade.innerHTML = Number(atual) - (iano.value)
       }
    </script>
    
</body>
</html>
