<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Cadastro</h1>
<form action="cadastro.php" method="post" autocomplete="on">
   
        <p>
            <label for="iuse">Usuário:</label>
            <input type="text" name="use" id="iuse" required minlength="5" maxlength="20" size="10" placeholder="Nome do Usuário" autocomplete="username">
        </p>

       
          <p>
              
                    <label for="isen">Senha:</label>
                    <input type="password" name="sen" id="isen" required minlength="8" size="8" placeholder="Mínimo 8 letras" autocomplete="current-password">
              
          </p>
      

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </p>

</form>

    
</body>
</html>
