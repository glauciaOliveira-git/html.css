<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixa</title>
    <style>
        h1{

            /*posso transformar o h1 em in line
            display inline;*/

            background-color: beige;
            width: 300px;
            height: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: brown;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            margin-top: 15px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;

            /*outline-width: 5px;
            outline-style: dashed;
            outline-color: blueviolet;*/
            outline: 5px dashed coral;

        }

        a{
            /*posso transformar inline em bock
            display block;/*

           /* border-width: 10px;
            border-style: solid;
            border-color: chocolate;*/

            border: 10px solid chocolate;

           /* padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;*/

            padding: 10px;

        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Os parágrafos também são exemplos de caixas box-level, mas os <a href="#">os links </a>são exemplos de caixas inline-level.</p>
    
</body>
</html>
