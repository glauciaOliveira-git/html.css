<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }

        col.cnome{

            background-color: chartreuse;
        }

        col.csexo{
            background-color: aqua;
        }
        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td{
            border: 1px solid black;
            padding: 8px;

        }
    </style>
</head>
<body>
    <table>
        <colgroup>
           <col class="cnome"> 
           <col class="csexo">
           <col class="cidade"> 
           <col class="cidade">
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
        
            <th scope="col">Nome</th>
            <th scope="col">Idade</th>
            <th scope="col">Sexo</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>20</td>
            <td>F</td>
            <td>Jornalista</td>
        </tr>

        <tr>
            <td>Mario</td>
            <td>30</td>
            <td>M</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Joana</td>
            <td>40</td>
            <td>F</td>
            <td>Bailarina</td>
        </tr>

        <tr>
            <td>Otávio</td>
            <td>29</td>
            <td>M</td>
            <td>Petroleiro</td>
        </tr>
        <tr> 
          <td>João</td>
            <td>60</td>
            <td>M</td>
            <td>Pedreiro</td>  
        </tr>
        <tr>
            <td>Marta</td>
            <td>51</td>
            <td>F</td>
            <td>Faxineira</td>
        </tr>
    </table>
</body>
</html>
